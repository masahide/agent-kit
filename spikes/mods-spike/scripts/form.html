<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>スパイク フォーム</title></head>
<body>
<h1>スパイク: 回答を POST する</h1>
<p><label>Q1 <select id="q1"><option value="">(未選択 = お任せ)</option><option value="A">A</option><option value="B">B</option></select></label></p>
<p><label>補足 <input id="note" size="60"></label></p>
<p><button id="send">送信</button> <span id="status"></span></p>
<script>
document.getElementById('send').onclick = async () => {
  const body = JSON.stringify({ answers: { q1: document.getElementById('q1').value }, note: document.getElementById('note').value })
  const s = document.getElementById('status')
  try {
    const r = await fetch('/answer?t=__TOKEN__', { method: 'POST', headers: { 'content-type': 'application/json' }, body })
    s.textContent = r.ok ? '送信しました。ターミナルに戻ってください。' : '送信に失敗しました: ' + r.status
  } catch (e) { s.textContent = '送信に失敗しました: ' + e }
}
</script>
</body></html>
