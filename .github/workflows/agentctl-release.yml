# agentctl のリリース: タグ agentctl-v<version> を push すると、各 OS 向けのバイナリと
# checksums.txt を作って GitHub Releases に添付する。install.sh / install.ps1 はここから取る。
#
#   git tag agentctl-v0.1.0 && git push origin agentctl-v0.1.0
name: agentctl release

on:
  push:
    tags: ['agentctl-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/agentctl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/agentctl/go.mod
          cache-dependency-path: tools/agentctl/go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#agentctl-v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/masahide/agent-kit/tools/agentctl/internal/cli.Version=$version" \
              -o "dist/agentctl-$os-$arch$ext" .
          done
          (cd dist && sha256sum agentctl-* > checksums.txt)
          ls -l dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "agentctl ${TAG#agentctl-v}" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/tools/agentctl/install.sh | sh\` (macOS / Linux) or \`irm https://raw.githubusercontent.com/${{ github.repository }}/main/tools/agentctl/install.ps1 | iex\` (Windows PowerShell). See docs/agentctl/usage.md."
